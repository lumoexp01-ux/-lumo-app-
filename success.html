<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMO — Pagamento confirmado</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
      gap: 16px;
    }
    p { font-size: 16px; opacity: 0.7; margin: 0; }
  </style>
</head>
<body>
  <p>Pagamento confirmado! Retornando ao app...</p>
  <script>
    // Tenta abrir o app nativo via deep link
    window.location.href = 'lumo://pagamento?status=sucesso';

    // Fallback: se ainda estiver no browser web (não native), redireciona para pagamento.html
    setTimeout(function () {
      window.location.replace('pagamento.html?status=sucesso');
    }, 1200);
  </script>
</body>
</html>
